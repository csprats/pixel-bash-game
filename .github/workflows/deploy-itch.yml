name: Publish to Itch.io

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Descargar el archivo zip que subiste a la release de GitHub
      - name: Download Release Assets
        uses: robinraju/release-downloader@v1.8
        with:
          latest: true
          fileName: "Pixel.Bash.Windows.zip"
          out-heading: false

      # 3. Instalar el Butler Oficial de Itch.io directamente desde sus servidores
      - name: Install Official Itch.io Butler
        run: |
          curl -L -o butler.zip https://itch.zone
          unzip butler.zip
          chmod +x butler
          mkdir -p ~/.bin
          mv butler ~/.bin/
          echo "$HOME/.bin" >> $GITHUB_PATH

      # 4. Ejecutar el comando oficial de subida de Butler
      - name: Upload via Official Butler Command
        run: |
          butler push Pixel.Bash.Windows.zip csprats/pixel-bash:windows
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
